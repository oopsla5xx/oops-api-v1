version: "2"
run:
  go: "1.26"
linters:
  enable:
    - bodyclose
    - gocritic
    - gosec
    - misspell
    - prealloc
    - revive
    - unconvert
  settings:
    gosec:
      excludes:
        - G304
    revive:
      rules:
        - name: exported
          severity: warning
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - gosec
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 50
  max-same-issues: 5
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/oopsla5xx/oops-api-v1
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
