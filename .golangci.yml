run:
  timeout: 5m
  go: "1.26"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - revive
    - misspell
    - gosec
    - bodyclose
    - prealloc
    - unconvert
    - gocritic

linters-settings:
  revive:
    rules:
      - name: exported
        severity: warning
  goimports:
    local-prefixes: github.com/oopsla5xx/oops-api-v1
  gosec:
    excludes:
      - G304

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - dupl
  max-issues-per-linter: 50
  max-same-issues: 5
