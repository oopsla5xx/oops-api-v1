root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/main"
  cmd = "go build -o ./tmp/main ./cmd/api"
  delay = 1000
  exclude_dir = ["tmp", "vendor", "docs", "bin"]
  exclude_regex = ["_test\\.go"]
  include_ext = ["go"]
  stop_on_error = true
  kill_delay = "200ms"
  send_interrupt = true
  log = "build-errors.log"

[log]
  time = true

[color]
  build = "yellow"
  runner = "green"
  watcher = "cyan"
  app = ""
  main = "magenta"

[misc]
  clean_on_exit = true
