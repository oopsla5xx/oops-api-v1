name: oops

# Production environment.
# Postgres and Redis are NOT managed here — use managed cloud services in production.

services:
  api:
    image: ${DOCKER_REGISTRY:-ghcr.io}/oopsla5xx/oops-api-v1:${VERSION:-latest}
    ports:
      - "8080:8080"
    env_file:
      - ../.env.production
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: rolling-update
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks:
      - oops-prod-network

networks:
  oops-prod-network:
    driver: bridge
