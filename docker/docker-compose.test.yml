name: oops-test

# CI test environment — ephemeral, isolated containers.
# Local dev uses the shared containers from docker-compose.dev.yml instead.

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oops
      POSTGRES_PASSWORD: oops
      POSTGRES_DB: oops_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oops -d oops_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - oops-test-network

  redis-test:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - oops-test-network

networks:
  oops-test-network:
    driver: bridge
