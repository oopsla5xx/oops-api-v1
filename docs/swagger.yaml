host: localhost:8080
info:
  contact: {}
  description: Oops AI-native Software Development Workspace API
  title: Oops API
  version: "1.0"
paths:
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: user data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_identity_interface.createUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_modules_identity_interface.userResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_oopsla5xx_oops-api-v1_internal_shared_response.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_oopsla5xx_oops-api-v1_internal_shared_response.Response'
      summary: Register a user account
      tags:
      - auth
  /health:
    get:
      description: Returns service liveness status. Does NOT check DB/Redis — use
        this for liveness probes only.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_health_interface.healthResponse'
      summary: Health check
      tags:
      - health
